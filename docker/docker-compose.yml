# Audit image built separately from rocker/r-ver:4.5.2 with docker/Dockerfile.
# Run the embedded article; only docs/ is shared with the host.
name: cfa-tutorial
services:
  audit:
    platform: linux/amd64
    image: ${CFA_IMAGE:-phdpablo/cfa-tutorial:4.5.2}
    working_dir: /home/rstudio
    environment:
      AUDIT_UID: ${AUDIT_UID:-1000}
      AUDIT_GID: ${AUDIT_GID:-1000}
    volumes:
      - type: bind
        source: ../docs
        target: /export/docs

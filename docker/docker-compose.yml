# Build the current checkout; do not substitute an older registry snapshot.
services:
  article:
    image: smart-cfa-local:r4.5.2-q1.9.37
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: smart-cfa
    ports:
      - 127.0.0.1:8787:8787
    environment:
      - DISABLE_AUTH=true
    restart: unless-stopped

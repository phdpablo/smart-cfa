name: Build and publish Smart CFA

on:
  push:
    branches: [main, pt_version]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish pt_version to GitHub Pages after validation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quarto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 3
      - name: Install TinyTeX
        run: quarto install tinytex --no-prompt
      - name: Record tool versions
        run: |
          quarto --version
          R --version
          quarto list tools
      # No restored Quarto/analysis cache: validate the checked-out sources.
      - name: Render HTML and PDF
        run: quarto render --to all
      - name: Preserve preview and PDF
        uses: actions/upload-artifact@v4
        with:
          name: smart-cfa-${{ github.sha }}
          path: docs/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/pt_version' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'
      - uses: actions/download-artifact@v4
        with:
          name: smart-cfa-${{ github.sha }}
          path: docs/
      - name: Publish validated output without rendering again
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
